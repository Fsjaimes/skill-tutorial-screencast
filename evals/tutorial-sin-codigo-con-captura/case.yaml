schema_version: "1.1"
name: tutorial-sin-codigo-con-captura
expected_outcome: |
  The skill asks for the screenshot (or works only with the elements the user described) and does not invent other UI; it plans the steps filter dates, click Exportar and confirm, writes GUION.md flagging which parts are assumed because there is no source code, and builds the project from the template with the same visual system (zooms, cursor, step captions, labels of at most 8 words).
