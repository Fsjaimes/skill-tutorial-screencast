    <!--
      ═══ SONIDO (tiempos locales a esta escena) ═══
      Escrito en el HTML, no creado por script: así HyperFrames lo mezcla en el render y se puede
      mover en Studio. Un <audio data-sfx="click"> por cada click() de la coreografía, en el mismo
      instante; el kit avisa en la consola si falta alguno. Narración: un <audio> por paso
      (assets/audio/voz/paso-NN.mp3), con data-start en el inicio de su paso. Volúmenes en references/audio.md.
    -->
    <div id="sound">
      <audio id="sfx-click-1" data-sfx="click" src="assets/sfx/click.mp3" data-start="2.6" data-duration="0.3" data-hf-media-start-basis="local" data-volume="0.5" data-track-index="20"></audio>
      <audio id="sfx-click-2" data-sfx="click" src="assets/sfx/click.mp3" data-start="9.6" data-duration="0.3" data-hf-media-start-basis="local" data-volume="0.5" data-track-index="20"></audio>
      <audio id="sfx-click-3" data-sfx="click" src="assets/sfx/click.mp3" data-start="18.2" data-duration="0.3" data-hf-media-start-basis="local" data-volume="0.5" data-track-index="20"></audio>
      <audio id="sfx-exito-1" data-sfx="exito" src="assets/sfx/exito.mp3" data-start="18.5" data-duration="0.8" data-hf-media-start-basis="local" data-volume="0.6" data-track-index="21"></audio>

  <script>
    (() => {
      function build() {
        const tl = gsap.timeline({ paused: true });

        // ═════════════════════════ KIT ═════════════════════════
        // Valores en references/style.md. Cada helper registra sus tweens en `tl` y lleva la cuenta
        // del estado de la cámara y del cursor, para que todo sea fromTo y seguro aunque la vista
        // previa salte en la línea de tiempo.
        const SMOOTH = "power2.inOut";

        // Cámara: centra (cx, cy) de la app con zoom z, recortado a los bordes. 1,0 s por defecto.
        let cam = { x: 0, y: 0, s: 1 };
        function camTo(t, cx, cy, z, dur = 1.0) {
          const x = Math.min(0, Math.max(1920 - 1920 * z, 960 - cx * z));
          const y = Math.min(0, Math.max(1080 - 1080 * z, 540 - cy * z));
          tl.fromTo("#cam", { x: cam.x, y: cam.y, scale: cam.s }, { x, y, scale: z, duration: dur, ease: SMOOTH, immediateRender: false }, t);
          cam = { x, y, s: z };
        }
        const wide = (t, dur = 1.0) => camTo(t, 960, 540, 1, dur);
        const toScreen = (ax, ay) => [ax * cam.s + cam.x, ay * cam.s + cam.y];
        tl.set("#cam", { x: 0, y: 0, scale: 1 }, 0);

        // Zona resaltada (coordenadas de la app): oscurece el resto entre t0 y t1.
        const spots = document.getElementById("spots");
        function spot(t0, t1, x, y, w, h) {
          const s = document.createElement("div");
          s.className = "spot";
          Object.assign(s.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
          spots.appendChild(s);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SMOOTH }, t0);
          tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: SMOOTH, immediateRender: false }, t1);
        }

        // Cursor: viaja en 0,35 s + dist/1400 (entre 0,5 y 1,1 s). Devuelve el instante de llegada.
        let cur = { x: 1150, y: 640 };
        tl.set("#cursor", { x: cur.x, y: cur.y }, 0);
        function move(t, x, y) {
          const d = Math.hypot(x - cur.x, y - cur.y);
          const dur = Math.min(1.1, Math.max(0.5, 0.35 + d / 1400));
          tl.fromTo("#cursor", { x: cur.x, y: cur.y }, { x, y, duration: dur, ease: SMOOTH, immediateRender: false }, t);
          cur = { x, y };
          return t + dur;
        }

        // Clic: pulsación del cursor y pulso en el punto. Llama a click() ≥ 0,5 s después de que llegue.
        const rips = document.getElementById("rips");
        const CLICKS = [];
        function click(t) {
          CLICKS.push(t);
          tl.fromTo("#cursor-in", { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo("#cursor-in", { scale: 0.86 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t + 0.08);
          const r = document.createElement("div");
          r.className = "rip";
          r.style.left = cur.x + "px";
          r.style.top = cur.y + "px";
          rips.appendChild(r);
          tl.fromTo(r, { scale: 0.25, opacity: 0.95 }, { scale: 1.5, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
        }

        // Escritura letra a letra a `cps` caracteres/s, con caret parpadeando mientras el campo tiene foco.
        // focusEnd: hasta cuándo parpadea el caret después de escribir. Devuelve el instante final.
        function type(t, textId, caretId, text, cps = 12, focusEnd = null) {
          const el = document.getElementById(textId);
          const n = { v: 0 };
          const dur = text.length / cps;
          tl.set(n, { v: 0 }, 0);
          tl.fromTo(n, { v: 0 }, { v: text.length, duration: dur, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = text.slice(0, Math.round(n.v)); } }, t);
          const end = focusEnd ?? t + dur + 1.0;
          tl.set("#" + caretId, { opacity: 0 }, 0);
          tl.set("#" + caretId, { opacity: 1 }, t - 0.3);
          for (let b = t + dur + 0.5; b < end; b += 1.0) {
            tl.set("#" + caretId, { opacity: 0 }, b);
            tl.set("#" + caretId, { opacity: 1 }, b + 0.5);
          }
          tl.set("#" + caretId, { opacity: 0 }, end);
          return t + dur;
        }

        // Rótulo de paso (abajo a la izquierda, fuera de la cámara).
        const hud = document.getElementById("hud");
        function step(t0, t1, n, text) {
          const w = document.createElement("div");
          w.className = "step";
          w.innerHTML = `<div class="step-in"><span class="step-n">Paso ${n}</span><span class="step-t">${text}</span></div>`;
          hud.appendChild(w);
          tl.fromTo(w.firstChild, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t0);
          tl.fromTo(w.firstChild, { opacity: 1, y: 0 }, { opacity: 0, y: 12, duration: 0.35, ease: "power2.in", immediateRender: false }, t1);
        }

        // Etiqueta con flecha junto a un punto (ax, ay) de la app. side: below | above | left | right.
        // Llámala DESPUÉS del camTo() de su toma: calcula la posición con esa cámara.
        function label(t0, t1, text, ax, ay, side = "below", warn = false) {
          const [sx, sy] = toScreen(ax, ay);
          const g = 30;
          const w = document.createElement("div");
          w.className = "lb";
          const place = { below: [sx, sy + g, "translate(-50%,0)"], above: [sx, sy - g, "translate(-50%,-100%)"], right: [sx + g, sy, "translate(0,-50%)"], left: [sx - g, sy, "translate(-100%,-50%)"] }[side];
          Object.assign(w.style, { left: place[0] + "px", top: place[1] + "px", transform: place[2] });
          const arrow = { below: "left:calc(50% - 9px);top:-8px", above: "left:calc(50% - 9px);bottom:-8px", right: "left:-8px;top:calc(50% - 9px)", left: "right:-8px;top:calc(50% - 9px)" }[side];
          w.innerHTML = `<div class="lb-in${warn ? " warn" : ""}"><span class="lb-ar" style="${arrow}"></span><span style="position:relative">${text}</span></div>`;
          hud.appendChild(w);
          const dy = { below: 10, above: -10 }[side] || 0, dx = { right: 10, left: -10 }[side] || 0;
          tl.fromTo(w.firstChild, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "expo.out" }, t0);
          tl.fromTo(w.firstChild, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, t1);
        }

        // ═════════════════════════ COREOGRAFÍA (editar) ═════════════════════════
        // Patrón de cada acción: camTo + spot → move → (0,5 s) → click → reacción en +0,05 s → label → wide.

        // ── Paso 1: llegar a la pantalla ──
        step(0.5, 11.0, 1, "Abre Clientes");
        camTo(1.0, 180, 300, 1.7);
        spot(1.0, 6.4, 12, 120, 312, 190);
        move(1.2, 120, 208);
        click(2.6);
        tl.fromTo("#it-cli-bg", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.65);
        label(2.9, 5.6, "Clientes está en el menú lateral", 320, 208, "right");
        wide(6.4);
        tl.fromTo("#skel", { opacity: 1 }, { opacity: 0, duration: 0.25 }, 6.8);
        tl.fromTo("#content", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 6.9);

        // ── Paso 2: diligenciar y guardar ──
        step(7.6, 25.4, 2, "Escribe el nombre y guarda");
        const fx = 327 + 32 + 28, fy = 91 + 89 + 126;   // esquina del campo Nombre en la app
        camTo(8.0, fx + 320, fy + 20, 1.7);
        spot(8.0, 16.6, fx - 12, fy - 46, 664, 112);
        move(8.4, fx + 60, fy + 26);
        click(9.6);
        tl.fromTo("#f-name", { borderColor: "#ced4da" }, { borderColor: "#25a0e2", duration: 0.15 }, 9.65);
        const typed = type(10.0, "f-name-txt", "f-name-caret", "Andes S.A.S", 12, 16.6);
        label(typed + 0.2, typed + 2.8, "Nombre o razón social del cliente", fx + 320, fy + 52, "below");
        const save = [327 + 32 + 1298 + 103, 91 + 89 + 340 + 25];
        camTo(16.6, save[0] - 200, save[1], 1.8);
        spot(16.6, 19.0, save[0] - 117, save[1] - 37, 234, 74);
        move(16.8, save[0], save[1]);
        click(18.2);
        tl.fromTo("#toast", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.5)" }, 18.5);
        camTo(19.0, 1670, 158, 1.6);
        spot(19.0, 22.8, 1448, 108, 444, 100);   // el resaltado sigue a lo que se explica: ahora el mensaje
        label(19.8, 22.4, "Confirmación: el cliente quedó creado", 1670, 196, "below");
        tl.fromTo("#toast", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 23.0);
        wide(23.2);

        // Cada click() necesita su <audio data-sfx="click"> en el bloque SONIDO (modos ambiente y narración).
        const sounded = [...document.querySelectorAll('#sound audio[data-sfx="click"]')].map((a) => parseFloat(a.getAttribute("data-start")));
        const missing = CLICKS.filter((t) => !sounded.some((s) => Math.abs(s - t) < 0.06));
        if (sounded.length && missing.length) console.error("tutorial-screencast: clics sin sonido en t = " + missing.join(", "));

        window.__timelines["tutorial"] = tl;
        if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
      }

      // La timeline se construye cuando la fuente ya cargó: así son correctas las medidas del layout.
      Promise.all([document.fonts.load('600 18px "Saira"'), document.fonts.ready]).then(build, build);
    })();
  </script>
