<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f7f9; }
      #root { position: relative; width: 100%; height: 100%; background: #f4f7f9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.6" data-width="1920" data-height="1080">
      <div id="tutorial" data-composition-id="tutorial" data-composition-src="compositions/tutorial.html"
        data-start="6" data-duration="26.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="6.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="31.6" data-duration="7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!--
        SONIDO · modo ambiente (references/audio.md).
        Música de la biblioteca copiada a assets/audio/musica.mp3. La línea de volumen sube en 1 s,
        se mantiene a 0,35 y baja en 1,5 s al final. En modo narración el nivel es 0,12 (cama bajo la voz)
        y sube a 0,35 solo en la intro y el cierre. En modo silencio, borra este <audio>.
      -->
      <audio id="musica" src="assets/audio/musica.mp3" data-start="0" data-duration="38.6" data-volume="0.35" data-track-index="10"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1,"v":0.35},{"t":37.1,"v":0.35},{"t":38.6,"v":0}]}]}'></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
